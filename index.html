<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia SF — Atualização do Sistema</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      background: #181818;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      color: #d4af37;
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      font-size: 15px;
      color: #ccc;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .icone {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .btn-whatsapp {
      display: inline-block;
      padding: 14px 25px;
      background-color: #25D366;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 6px;
      transition: 0.3s ease;
    }

    .btn-whatsapp:hover {
      background-color: #1ebe5d;
      transform: scale(1.05);
    }

    .tempo {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="icone">⚙️</div>

    <h1>Estamos Atualizando o Sistema</h1>

    <p>
      A Barbearia SF está passando por melhorias para oferecer uma experiência ainda melhor.
      O sistema de agendamento estará temporariamente indisponível.
    </p>

    <a 
      href="https://wa.me/5511959569739?text=Olá,%20gostaria%20de%20agendar%20um%20horário."
      target="_blank"
      class="btn-whatsapp">
      Falar no WhatsApp
    </a>

    <div class="tempo">
      Previsão de retorno em breve.
    </div>
  </div>

</body>
</html>
