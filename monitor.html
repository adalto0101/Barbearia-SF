<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor — Barbearia SF</title>
<style>
  :root{
    --bg:#0d0d0f; --panel:#16161a; --line:#26262c;
    --gold:#d4af37; --gold-dim:#8a7327;
    --txt:#f4f2ea; --muted:#8a8a92; --green:#2ecc71; --gap:#e67e22;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ── CABEÇALHO ── */
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:2vh 3vw; border-bottom:1px solid var(--line);
  }
  .marca{display:flex;align-items:center;gap:14px}
  .marca img{height:5vh}
  .marca h1{
    font-size:2.4vh; letter-spacing:3px; font-weight:700;
    text-transform:uppercase; color:var(--gold);
  }
  .relogio{text-align:right}
  .header-dir{display:flex;align-items:center;gap:2vw}
  .btn-girar{
    background:transparent;border:1px solid var(--line);color:var(--gold);
    width:6vh;height:6vh;min-width:40px;min-height:40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .btn-girar:hover{background:var(--panel);border-color:var(--gold-dim)}
  .btn-girar:active{transform:scale(.9)}
  .btn-girar svg{width:60%;height:60%}
  .btn-girar.girando svg{animation:girar .6s ease}
  @keyframes girar{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .relogio .hora{
    font-size:5vh; font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:2px; line-height:1;
  }
  .relogio .data{font-size:2vh;color:var(--muted);text-transform:capitalize;margin-top:4px}

  /* ── CORPO ── */
  main{flex:1;display:grid;grid-template-columns:1.1fr 0.9fr;gap:0;min-height:0}

  /* PRÓXIMO CLIENTE (destaque) */
  .agora{
    padding:4vh 3vw; display:flex; flex-direction:column; justify-content:center;
    border-right:1px solid var(--line); position:relative; min-width:0;
  }
  .agora .eyebrow{
    font-size:clamp(13px,1.9vh,26px); letter-spacing:4px; text-transform:uppercase;
    color:var(--gold); margin-bottom:2vh; display:flex;align-items:center;gap:12px;
  }
  .dot{width:12px;height:12px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}
    70%{box-shadow:0 0 0 18px rgba(46,204,113,0)}
    100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}
  }
  .agora .hora-grande{
    font-size:clamp(90px,20vh,240px); font-weight:800; line-height:.9;
    font-variant-numeric:tabular-nums; letter-spacing:-2px;
    transition:font-size .3s ease;
  }
  .agora .nome{font-size:clamp(40px,9vh,110px);font-weight:700;margin-top:1vh;text-transform:uppercase;word-break:break-word;line-height:1;transition:font-size .3s ease}
  .agora .servico{font-size:clamp(20px,4vh,48px);color:var(--muted);margin-top:1.5vh}
  .agora .badge{
    display:inline-block;margin-top:2.5vh;font-size:clamp(14px,2.2vh,28px);font-weight:700;
    background:var(--gold);color:#000;padding:6px 16px;border-radius:20px;
    letter-spacing:1px;width:fit-content;
  }
  .agora.vazio .hora-grande{font-size:clamp(60px,12vh,140px);color:var(--muted)}
  .agora.vazio .nome{font-size:clamp(24px,5vh,56px);color:var(--muted);font-weight:400}

  /* FILA DO DIA */
  .fila{padding:3vh 2.5vw;display:flex;flex-direction:column;min-height:0}
  .fila h2{
    font-size:1.9vh;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);margin-bottom:2vh;flex-shrink:0;
  }
  .fila-scroll{overflow-y:auto;overflow-x:hidden;flex:1;display:flex;flex-direction:column;gap:1.4vh;scrollbar-width:none}
  .fila-scroll::-webkit-scrollbar{display:none}
  .card{
    display:flex;align-items:center;gap:2vw;
    background:var(--panel);border:1px solid var(--line);
    border-left:5px solid var(--gold-dim);
    border-radius:12px;padding:2vh 2vw;flex-shrink:0;
  }
  .card .h{
    font-size:clamp(22px,4vh,52px);font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--gold);min-width:5ch;
  }
  .card .info{flex:1;min-width:0}
  .card .info .c{font-size:clamp(18px,3.2vh,42px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .card .info .s{font-size:clamp(13px,2.1vh,26px);color:var(--muted);margin-top:2px}
  .card .plano{font-size:clamp(11px,1.6vh,20px);font-weight:700;background:var(--gold);color:#000;padding:4px 12px;border-radius:12px;white-space:nowrap}
  .card.proximo{border-left-color:var(--green)}
  .card.proximo .h{color:var(--green)}

  /* INTERVALO (lacuna) */
  .intervalo{
    display:flex;align-items:center;gap:1vw;
    padding:.6vh 2vw;color:var(--gap);flex-shrink:0;
    font-size:1.7vh;letter-spacing:1px;
  }
  .intervalo .barra{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--gap) 0 8px,transparent 8px 16px);opacity:.5}

  .vazio-fila{color:var(--muted);font-size:2.4vh;text-align:center;margin-top:6vh}

  footer{
    padding:1.4vh 3vw;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-size:1.6vh;color:var(--muted);flex-shrink:0;
  }
  .status-conexao{display:flex;align-items:center;gap:8px}
  .status-conexao .d{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .status-conexao.off .d{background:#e74c3c}

  /* ═══ ORIENTAÇÃO RETRATO (tela em pé) ═══ */
  /* Vale automaticamente em tela física vertical, OU quando forçado pelo botão. */
  @media (orientation: portrait){
    body:not(.forcar-paisagem) main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    body:not(.forcar-paisagem) .agora{border-right:none;border-bottom:1px solid var(--line);padding:3vh 5vw}
    body:not(.forcar-paisagem) .agora .hora-grande{font-size:22vw}
    body:not(.forcar-paisagem) .agora .nome{font-size:9vw}
    body:not(.forcar-paisagem) .agora .servico{font-size:4.5vw}
    body:not(.forcar-paisagem) .agora.vazio .hora-grande{font-size:16vw}
    body:not(.forcar-paisagem) .agora.vazio .nome{font-size:5vw}
    body:not(.forcar-paisagem) .fila{padding:3vh 5vw}
    body:not(.forcar-paisagem) .card .h{font-size:6vw}
    body:not(.forcar-paisagem) .card .info .c{font-size:5vw}
    body:not(.forcar-paisagem) .card .info .s{font-size:3.4vw}
    body:not(.forcar-paisagem) .card .plano{font-size:2.8vw}
    body:not(.forcar-paisagem) .relogio .hora{font-size:6vw}
    body:not(.forcar-paisagem) .marca h1{font-size:3.6vw}
  }

  /* Retrato FORÇADO pelo botão (mesmo em tela física horizontal) */
  body.forcar-retrato main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  body.forcar-retrato .agora{border-right:none;border-bottom:1px solid var(--line);padding:3vh 5vw}
  body.forcar-retrato .fila{padding:3vh 5vw}

  /* ═══ TELAS PEQUENAS (celular) ═══ */
  @media (max-width:600px){
    header{padding:12px 16px}
    .marca img{height:32px}
    .marca h1{font-size:14px}
    .relogio .hora{font-size:26px}
    .relogio .data{font-size:12px}
    footer{font-size:11px;padding:8px 16px}
  }

  /* ═══ PAISAGEM: preencher a altura, nada de espaço morto ═══ */
  /* tela física horizontal (não forçada a retrato) OU forçada a paisagem */
  @media (orientation: landscape){
    body:not(.forcar-retrato) .fila-scroll{justify-content:flex-start;gap:1.4vh}
    body:not(.forcar-retrato) .fila-scroll .card{
      flex:0 0 auto;min-height:clamp(58px,11vh,130px);padding:0 2vw;
    }
    /* garante fonte grande nos cartões usando a altura da tela */
    body:not(.forcar-retrato) .card .h{font-size:clamp(28px,5vh,60px)}
    body:not(.forcar-retrato) .card .info .c{font-size:clamp(22px,4vh,48px)}
    body:not(.forcar-retrato) .card .info .s{font-size:clamp(15px,2.4vh,30px)}
    body:not(.forcar-retrato) .agora{justify-content:center}
  }
  body.forcar-paisagem .fila-scroll{justify-content:flex-start;gap:1.4vh}
  body.forcar-paisagem .fila-scroll .card{flex:0 0 auto;min-height:clamp(58px,11vh,130px);padding:0 2vw}

  /* ═══ FAIXA DE HORÁRIOS LIVRES ═══ */
  .livres{
    border-top:1px solid var(--line);
    padding:1.6vh 3vw;display:flex;align-items:center;gap:2vw;flex-shrink:0;
    background:rgba(255,255,255,.02);
  }
  .livres-titulo{
    font-size:clamp(12px,1.9vh,22px);letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;flex-shrink:0;
  }
  .livres-lista{
    display:flex;gap:.8vw;flex-wrap:wrap;overflow:hidden;flex:1;
  }
  .slot-livre{
    font-size:clamp(14px,2.4vh,30px);font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--green);border:1px solid rgba(46,204,113,.35);
    background:rgba(46,204,113,.08);border-radius:8px;padding:.5vh 1vw;white-space:nowrap;
  }
  .livres-vazio{color:var(--muted);font-size:clamp(13px,2vh,24px)}

  /* Animação de troca de orientação */
  main{transition:opacity .25s ease}
  main.trocando{opacity:0;transform:scale(.98)}
</style>
</head>
<body>
  <header>
    <div class="marca">
      <img src="logo.png" alt="" onerror="this.style.display='none'">
      <h1>Barbearia SF</h1>
    </div>
    <div class="header-dir">
      <button id="btn-girar" class="btn-girar" title="Girar tela" aria-label="Girar orientação da tela">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4v5h5"></path>
          <path d="M20 20v-5h-5"></path>
          <path d="M4 9a8 8 0 0 1 14-3"></path>
          <path d="M20 15a8 8 0 0 1-14 3"></path>
        </svg>
      </button>
      <div class="relogio">
        <div class="hora" id="relogio-hora">--:--</div>
        <div class="data" id="relogio-data">—</div>
      </div>
    </div>
  </header>

  <main>
    <section class="agora vazio" id="painel-agora">
      <div class="eyebrow"><span class="dot"></span> Próximo cliente</div>
      <div class="hora-grande" id="ag-hora">--:--</div>
      <div class="nome" id="ag-nome">Sem agendamentos</div>
      <div class="servico" id="ag-servico"></div>
      <span class="badge" id="ag-badge" style="display:none"></span>
    </section>

    <section class="fila">
      <h2>Ainda hoje</h2>
      <div class="fila-scroll" id="fila"></div>
    </section>
  </main>

  <section class="livres" id="secao-livres">
    <div class="livres-titulo">Horários livres hoje</div>
    <div class="livres-lista" id="livres-lista"></div>
  </section>

  <footer>
    <div class="status-conexao" id="conexao"><span class="d"></span> <span id="conexao-txt">Conectando…</span></div>
    <div id="resumo-dia">—</div>
  </footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1mkw9lTCa1khBcTNBHf4nC_MkC9lECIk",
  authDomain: "barbearia-sf1-0.firebaseapp.com",
  databaseURL: "https://barbearia-sf1-0-default-rtdb.firebaseio.com",
  projectId: "barbearia-sf1-0",
  storageBucket: "barbearia-sf1-0.firebasestorage.app",
  messagingSenderId: "638200163686",
  appId: "1:638200163686:web:d6e615289d181b9da62ca7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

// helpers
const hojeStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const minutos = (hhmm) => {
  const [h,m] = (hhmm||'0:0').split(':').map(Number);
  return (h||0)*60 + (m||0);
};
const paraHHMM = (min) => `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;

// relógio
function tickRelogio(){
  const d = new Date();
  document.getElementById('relogio-hora').textContent =
    `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  document.getElementById('relogio-data').textContent =
    `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
}
tickRelogio();
setInterval(tickRelogio, 1000);

let agendamentosDia = [];      // só clientes reais (para a fila)
let ocupadosDia = [];          // todos, incluindo BLOQUEADO (para calcular livres)
let horariosFuncionamento = null;

// horário de funcionamento (para saber abertura/fechamento do dia)
onValue(ref(db, 'horarios_funcionamento'), (snap) => {
  horariosFuncionamento = snap.val() || {};
  render();
}, (err) => console.error(err));

// escuta o Firebase
onValue(ref(db, 'agendamentos'), (snap) => {
  marcarConexao(true);
  const dados = snap.val() || {};
  const hoje = hojeStr();
  const doDia = Object.entries(dados)
    .map(([id,a]) => ({ id, ...a }))
    .filter(a => a && a.data === hoje)
    .sort((a,b) => minutos(a.hora) - minutos(b.hora));
  ocupadosDia = doDia; // inclui bloqueios
  agendamentosDia = doDia.filter(a => a.cliente !== 'BLOQUEADO');
  render();
}, (err) => { console.error(err); marcarConexao(false); });

function marcarConexao(ok){
  const el = document.getElementById('conexao');
  el.classList.toggle('off', !ok);
  document.getElementById('conexao-txt').textContent = ok ? 'Ao vivo' : 'Sem conexão';
}

function render(){
  const d = new Date();
  const agora = d.getHours()*60 + d.getMinutes();
  // ainda relevantes hoje = não terminaram (início + duração > agora)
  const ativos = agendamentosDia.filter(a => (minutos(a.hora) + (a.duracao||20)) > agora);

  const painel = document.getElementById('painel-agora');
  const fila = document.getElementById('fila');
  const eyebrow = painel.querySelector('.eyebrow');

  if (ativos.length === 0){
    painel.classList.add('vazio');
    if (eyebrow) eyebrow.innerHTML = '<span class="dot"></span> Encerrado';
    document.getElementById('ag-hora').textContent = '✓';
    document.getElementById('ag-nome').textContent = 'Dia encerrado';
    document.getElementById('ag-servico').textContent = 'Nenhum atendimento restante';
    document.getElementById('ag-badge').style.display = 'none';
    fila.innerHTML = '<div class="vazio-fila">Sem próximos agendamentos hoje.</div>';
    document.getElementById('resumo-dia').textContent =
      `${agendamentosDia.length} atendimento(s) hoje`;
    renderLivres();
    return;
  }

  // Alguém está sendo atendido agora? (já começou E ainda não terminou)
  const emAtendimento = ativos.find(a => {
    const ini = minutos(a.hora);
    return ini <= agora && (ini + (a.duracao||20)) > agora;
  });

  // destaque = quem está na cadeira; se ninguém, o próximo a chegar
  const destaque = emAtendimento || ativos[0];
  painel.classList.remove('vazio');
  if (eyebrow){
    eyebrow.innerHTML = emAtendimento
      ? '<span class="dot"></span> Em atendimento'
      : '<span class="dot"></span> Próximo cliente';
  }
  document.getElementById('ag-hora').textContent = destaque.hora;
  document.getElementById('ag-nome').textContent = destaque.cliente || '—';
  document.getElementById('ag-servico').textContent =
    `${destaque.servicoNome || 'Atendimento'} · ${destaque.duracao||20} min`;
  const badge = document.getElementById('ag-badge');
  if (destaque.ehPlano){
    badge.style.display = 'inline-block';
    badge.textContent = destaque.planoNome ? `PLANO · ${destaque.planoNome}` : 'PLANO';
  } else {
    badge.style.display = 'none';
  }

  // fila = todos os ativos que não são o destaque, em ordem
  const resto = ativos.filter(a => a !== destaque);
  fila.innerHTML = '';
  // ponto de partida dos intervalos: fim do que está em atendimento, ou "agora"
  let fimAnterior = Math.max(agora, minutos(destaque.hora) + (destaque.duracao||20));

  if (resto.length === 0){
    fila.innerHTML = '<div class="vazio-fila">Esse é o último de hoje.</div>';
  }

  resto.forEach((a, i) => {
    const ini = minutos(a.hora);
    const folga = ini - fimAnterior;
    // mostra intervalo se houver folga significativa (>= 10 min)
    if (folga >= 10){
      const div = document.createElement('div');
      div.className = 'intervalo';
      div.innerHTML = `<span>⏸ intervalo ${folga} min</span><span class="barra"></span><span>${paraHHMM(fimAnterior)}–${a.hora}</span>`;
      fila.appendChild(div);
    }
    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' proximo' : '');
    card.innerHTML = `
      <div class="h">${a.hora}</div>
      <div class="info">
        <div class="c">${a.cliente || '—'}</div>
        <div class="s">${a.servicoNome || 'Atendimento'} · ${a.duracao||20} min</div>
      </div>
      ${a.ehPlano ? '<span class="plano">PLANO</span>' : ''}`;
    fila.appendChild(card);
    fimAnterior = ini + (a.duracao||20);
  });

  document.getElementById('resumo-dia').textContent =
    `${ativos.length} restante(s) · ${agendamentosDia.length} no total hoje`;
  renderLivres();
  setTimeout(iniciarAutoScroll, 100);
}

// ── Botão de girar orientação ──
const btnGirar = document.getElementById('btn-girar');
const mainEl = document.querySelector('main');
btnGirar.addEventListener('click', () => {
  const body = document.body;
  // Descobre a orientação efetiva atual (física ou já forçada)
  const ehRetratoAgora = body.classList.contains('forcar-retrato') ||
    (!body.classList.contains('forcar-paisagem') && window.matchMedia('(orientation: portrait)').matches);

  // animação: apaga, troca, reacende
  btnGirar.classList.remove('girando');
  void btnGirar.offsetWidth; // reinicia a animação
  btnGirar.classList.add('girando');
  mainEl.classList.add('trocando');

  setTimeout(() => {
    body.classList.remove('forcar-retrato', 'forcar-paisagem');
    body.classList.add(ehRetratoAgora ? 'forcar-paisagem' : 'forcar-retrato');
    render(); // recalcula tamanhos da fila para a nova orientação
    mainEl.classList.remove('trocando');
  }, 250);
});

// ── Horários livres de hoje ──
function renderLivres(){
  const lista = document.getElementById('livres-lista');
  if (!horariosFuncionamento){ lista.innerHTML = ''; return; }

  const d = new Date();
  const agora = d.getHours()*60 + d.getMinutes();
  // chave do dia da semana no formato do banco
  const chaveDia = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][d.getDay()];
  const config = horariosFuncionamento[chaveDia];

  if (!config || config.fechado){
    lista.innerHTML = '<span class="livres-vazio">Fechado hoje</span>';
    return;
  }

  const abertura = minutos(config.inicio);
  const fechamento = minutos(config.fim);
  const SLOT = 20; // mesmo passo do agendamento

  const livres = [];
  for (let t = abertura; t <= fechamento; t += SLOT){
    if (t <= agora) continue; // já passou
    const fimSlot = t + SLOT;
    // ocupado se conflita com qualquer agendamento OU bloqueio
    const ocupado = ocupadosDia.some(a => {
      const ini = minutos(a.hora);
      const fim = ini + (Number(a.duracao) || 20);
      return t < fim && fimSlot > ini;
    });
    if (!ocupado) livres.push(paraHHMM(t));
  }

  if (livres.length === 0){
    lista.innerHTML = '<span class="livres-vazio">Nenhum horário livre restante hoje</span>';
    return;
  }
  lista.innerHTML = livres.map(h => `<span class="slot-livre">${h}</span>`).join('');
}

// ── Auto-scroll da fila quando não cabe tudo na tela ──
let scrollTimer = null;
function iniciarAutoScroll(){
  const fila = document.getElementById('fila');
  if (scrollTimer){ clearInterval(scrollTimer); scrollTimer = null; }
  // só rola se o conteúdo é maior que a área visível
  if (fila.scrollHeight <= fila.clientHeight + 8) { fila.scrollTop = 0; return; }

  let dir = 1;          // 1 desce, -1 sobe
  let pausa = 0;        // ciclos de pausa nas pontas
  scrollTimer = setInterval(() => {
    if (pausa > 0){ pausa--; return; }
    const max = fila.scrollHeight - fila.clientHeight;
    fila.scrollTop += dir * 1.2;
    if (fila.scrollTop >= max){ fila.scrollTop = max; dir = -1; pausa = 25; } // ~2s parado embaixo
    else if (fila.scrollTop <= 0){ fila.scrollTop = 0; dir = 1; pausa = 25; } // ~2s parado no topo
  }, 40);
}
